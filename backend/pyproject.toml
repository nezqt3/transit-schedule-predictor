[project]
name = "transport-delay-backend"
version = "0.1.0"
description = "Backend for public transport delay prediction system"
requires-python = ">=3.12"


# -------------------------
# Pytest
# -------------------------

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"


# -------------------------
# Ruff
# -------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"