<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backend API — OpenAPI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #notice { padding: 10px 16px; background: #fff3cd; font-size: 14px; }
      .swagger-ui .topbar { display: none; }
    </style>
  </head>
  <body>
    <div id="notice">
      Полная спецификация: <a href="openapi.json">openapi.json</a>. Живой Swagger —
      <a href="http://localhost:8000/docs">http://localhost:8000/docs</a> (нужен запущенный backend).
    </div>
    <div id="swagger"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: "openapi.json",
        dom_id: "#swagger",
        deepLinking: true,
        tryItOutEnabled: false,
      });
    </script>
  </body>
</html>
