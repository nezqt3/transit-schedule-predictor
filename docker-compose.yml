services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transport}
      POSTGRES_USER: ${POSTGRES_USER:-transport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transport}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build: ./ml
    environment:
      ML_SERVICE_HOST: 0.0.0.0
      ML_SERVICE_PORT: 8001
      ARTIFACTS_DIR: /app/artifacts
      MODEL_NAME: ${MODEL_NAME:-baseline}
      MODEL_VERSION: ${MODEL_VERSION:-1.0}
      SCHEDULE_PLAN_PATH: /app/runtime_data/schedule_plan.csv
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    volumes:
      - ./data/raw/validate:/app/runtime_data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ML_SERVICE_URL: http://ml:8001
      NDTP_HOST: 0.0.0.0
      NDTP_PORT: 9201
      RUNTIME_SCHEDULE_PATH: /app/runtime_data/schedule_plan.csv
      RUNTIME_TRAFFIC_PATH: /app/runtime_data/traffic.csv
      REPLAY_SCHEDULE_PATH: /app/replay_data/schedule.csv
      REPLAY_TRAFFIC_PATH: /app/replay_data/traffic.csv
      REPLAY_LABELS_PATH: /app/replay_labels.csv
      DATASET_REPLAY_URL: http://dataset-replay:18081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-transport}
      POSTGRES_USER: ${POSTGRES_USER:-transport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-dispatcher}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-transport}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production-use-32-bytes}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-480}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-transport_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_DATABASE_CONNECT_TIMEOUT_S: ${AUTH_DATABASE_CONNECT_TIMEOUT_S:-3.0}
    ports:
      - "8000:8000"
      - "9201:9201"
    volumes:
      - ./data/raw/validate:/app/runtime_data:ro
      - ./data/raw/test:/app/replay_data:ro
      - ./data/raw/labels/labels_test.csv:/app/replay_labels.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-Сигнальная сетка}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-3000}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    environment:
      BACKEND_UPSTREAM: backend:8000
      LISTEN_PORT: 8080
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started

  # pnpm dev + HMR: docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_started

  # Дополнительный CSV → NDTP replay для расширенного дебага.
  # Не заменяет эмулятор организаторов и запускается только явным профилем:
  # docker compose --profile replay up -d --build backend dataset-replay
  dataset-replay:
    profiles: ["replay"]
    build: ./emulator/dataset_replay
    environment:
      REPLAY_DATA_ROOT: /data
      REPLAY_NDTP_TARGET_HOST: backend
      REPLAY_NDTP_TARGET_PORT: 9201
    ports:
      - "${REPLAY_API_PORT:-18081}:18081"
    volumes:
      - ./data/raw:/data:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
