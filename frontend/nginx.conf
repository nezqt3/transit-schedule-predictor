map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${LISTEN_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Healthcheck для docker compose: не зависит от backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend может ещё не подняться: резолвим адрес на каждый запрос,
    # иначе nginx упадёт на старте из-за неизвестного хоста.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # REST + WebSocket бэкенда под одним путём.
    location /api/ {
        set $backend_upstream http://${BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger из FastAPI живёт на бэкенде, фронту отдаём через тот же origin.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        set $docs_upstream http://${BACKEND_UPSTREAM};
        proxy_pass $docs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Хэшированные сборкой ассеты можно кешировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA-роутинг: неизвестный путь отдаём приложению.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
